# Prepzone — production (Oracle Cloud VM). Ishga tushirish: DEPLOY.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prepzone
      POSTGRES_USER: prepzone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD ni kiriting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepzone -d prepzone"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Port tashqariga ochilmaydi — bazaga faqat api konteyneri ulanadi.

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://prepzone:${POSTGRES_PASSWORD}@db:5432/prepzone
      # Study Room: brauzer wss://DOMAIN/rtc ga ulanadi, API esa ichki tarmoqdan.
      LIVEKIT_URL: wss://${DOMAIN}
      LIVEKIT_API_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  # Study Room uchun o'z video serverimiz (LiveKit SFU). Signal Caddy orqali
  # (/rtc), media 7881/tcp va 7882/udp orqali to'g'ridan-to'g'ri.
  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DESMOS_API_KEY: ${VITE_DESMOS_API_KEY:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?.env faylida DOMAIN ni kiriting}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
