# Prepzone — production (Oracle Cloud VM). Ishga tushirish: DEPLOY.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prepzone
      POSTGRES_USER: prepzone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD ni kiriting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepzone -d prepzone"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Port tashqariga ochilmaydi — bazaga faqat api konteyneri ulanadi.

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://prepzone:${POSTGRES_PASSWORD}@db:5432/prepzone
      # Study Room: TURN relay (coturn) uchun vaqtinchalik login yaratiladi.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
    depends_on:
      db:
        condition: service_healthy

  # Study Room: video brauzerlar orasida to'g'ridan-to'g'ri (P2P). Ikki qurilma
  # to'g'ridan-to'g'ri ulana olmasa (qattiq operator NAT) — shu TURN relay.
  # network_mode: host — TURN relay portlari (49160-49260/udp) uchun tavsiya.
  # Ochiq portlar (Oracle konsoli + iptables): 3478/udp, 3478/tcp, 49160-49260/udp.
  coturn:
    image: coturn/coturn:4.18
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49260
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?.env faylida TURN_SECRET ni kiriting}
      - --realm=${DOMAIN}
      - --external-ip=${TURN_EXTERNAL_IP:-92.5.135.143}/${TURN_PRIVATE_IP:-10.0.0.212}
      - --fingerprint
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      - --stale-nonce=600
      - --total-quota=200
      - --user-quota=6
      # Relay ichki tarmoqlarga (DB, docker, metadata) yo'l ochmasin.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DESMOS_API_KEY: ${VITE_DESMOS_API_KEY:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?.env faylida DOMAIN ni kiriting}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
