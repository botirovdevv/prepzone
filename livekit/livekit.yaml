# LiveKit server (Study Room video/ovoz/ekran). docker-compose'dagi "livekit" xizmati.
# Kalitlar LIVEKIT_KEYS muhit o'zgaruvchisidan olinadi (docker-compose.yml).
#
# Ulanish yo'llari:
#   wss://DOMAIN/rtc   — signal (Caddy orqali, 443-port)
#   7881/tcp, 7882/udp — media (to'g'ridan-to'g'ri; Oracle Cloud konsolida va
#                        VM iptables'da ochiq bo'lishi kerak — DEPLOY.md)
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # VM ichidagi IP xususiy (Oracle 1:1 NAT) — tashqi IP STUN orqali aniqlanadi.
  use_external_ip: true
room:
  empty_timeout: 300
  max_participants: 2
logging:
  level: info
