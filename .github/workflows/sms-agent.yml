name: SMS-agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sms-agent/**"
      - ".github/workflows/sms-agent.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: prepzone-sms-agent
          path: sms-agent/app/build/outputs/apk/release/*.apk
